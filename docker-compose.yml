version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: pharmacy-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: pharmacy-app
    ports:
      - "8080:8080"
    environment:
      JDBC_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      JDBC_USER: ${JDBC_USER}
      JDBC_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JDBC_DRIVER: ${JDBC_DRIVER}
    depends_on:
      db:
        condition: service_healthy
